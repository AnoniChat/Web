name: Next.js Frontend CI/CD

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

env:
  DOCKER_IMAGE: ghcr.io/anonichat/web/react-app
  CONTAINER_NAME: anonichat-frontend
  WORKING_DIR: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    # 1. 코드 체크아웃
    - name: 📂 Checkout code
      uses: actions/checkout@v4

    # 2. Node.js 설정
    - name: 🟢 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

    # 3. 의존성 설치 및 린트 검사
    - name: 📦 Install dependencies
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        npm ci
        npm run lint || echo "⚠️ Lint 경고가 있지만 계속 진행합니다."

    # 4. Docker 로그인 (GHCR)
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 5. Docker 메타데이터 추출
    - name: 🏷️ Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-

    # 6. Docker 이미지 빌드 및 푸시
    - name: 🐳 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.WORKING_DIR }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=https://anonichat.world/api

    # 7. Vultr 서버에 배포
    - name: 🚀 Deploy to Vultr
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VULTR_HOST }}
        username: ${{ secrets.VULTR_USERNAME }}
        key: ${{ secrets.VULTR_SSH_KEY }}
        script: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          docker rmi ${{ env.DOCKER_IMAGE }}:latest || true
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            --network elk-stack_elk \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_API_URL=https://anonichat.world/api \
            --expose 3000 \
            ${{ env.DOCKER_IMAGE }}:latest
          sleep 5
          docker ps | grep ${{ env.CONTAINER_NAME }}
          echo "✅ Frontend 배포 완료!"

    # 8. 이미지 정리
    - name: 🧹 Clean up old images
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VULTR_HOST }}
        username: ${{ secrets.VULTR_USERNAME }}
        key: ${{ secrets.VULTR_SSH_KEY }}
        script: docker image prune -f
